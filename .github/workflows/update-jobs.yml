
name: Luisa JobFinder - Stellen automatisch suchen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
      timezone: 'Europe/Berlin'
    - cron: '0 18 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: luisa-jobfinder-refresh
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stellen automatisch suchen
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOOBLE_BATCH: ${{ github.event.schedule == '0 12 * * *' && 'first' || github.event.schedule == '0 18 * * *' && 'second' || 'manual' }}
        run: python update_jobs.py

      - name: Stellenliste aktualisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automatic job matches"
            git push
          fi
